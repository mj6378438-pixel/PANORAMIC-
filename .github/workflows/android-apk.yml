name: Compilar APK Android

on:
  push:
    branches: [main, master, 'ccr-*']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      nombre: ${{ steps.apk.outputs.nombre }}
      version: ${{ steps.apk.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos
        run: npx tsc --noEmit

      - name: Generar proyecto Android
        run: npx expo prebuild --platform android --no-install

      - name: Compilar APK (release)
        working-directory: android
        env:
          GRADLE_OPTS: -Xmx4g -Dorg.gradle.jvmargs=-Xmx4g
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64

      - name: Preparar archivo
        id: apk
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          NOMBRE="GestorEconomico-v${VERSION}-${{ github.run_number }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NOMBRE"
          echo "nombre=$NOMBRE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ steps.apk.outputs.nombre }}


  probar:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk

      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Probar en emulador Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: bash scripts/probar-apk.sh "$(ls apk/*.apk | head -n1)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-emulador
          path: capturas

  publicar:
    needs: [apk, probar]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.apk.outputs.version }}-${{ github.run_number }}
          name: Gestor Económico v${{ needs.apk.outputs.version }} (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          files: ${{ needs.apk.outputs.nombre }}
          body: |
            📱 **Descarga el archivo `.apk` de abajo e instálalo en tu Android.**

            Si el móvil lo bloquea, permite «Instalar apps desconocidas» para tu navegador o gestor de archivos.

            ✅ Probado automáticamente en un emulador Android antes de publicarse.
